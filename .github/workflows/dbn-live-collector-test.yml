
name: DBN Live Collector Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbn-live-collector-test
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Install CyTube socket client
        run: npm install --no-save --no-package-lock --ignore-scripts socket.io-client@4

      - name: Collect Anthology Horror programming
        env:
          DBN_UPDATE_TOKEN: ${{ secrets.DBN_UPDATE_TOKEN }}
        run: |
          node <<'NODE'
          const { io } = require('socket.io-client');

          const CHANNEL = 'Anthology-Horror';
          const WORKER_URL =
            'https://dbn-live-guide.thaliquorman.workers.dev/update';
          const TOKEN = process.env.DBN_UPDATE_TOKEN;

          function currentTitle(data) {
            if (typeof data === 'string') return data.trim();
            if (!data || typeof data !== 'object') return '';
            if (typeof data.title === 'string') return data.title.trim();
            if (data.media && typeof data.media.title === 'string') {
              return data.media.title.trim();
            }
            return '';
          }

          async function readOneRoom() {
            const response = await fetch(
              'https://cytu.be/socketconfig/' +
              encodeURIComponent(CHANNEL) + '.json',
              { signal: AbortSignal.timeout(12000) }
            );

            if (response.status === 429) {
              throw new Error('CyTube rate limit (429). Stopping without retry.');
            }

            if (!response.ok) {
              throw new Error('CyTube configuration HTTP ' + response.status);
            }

            const config = await response.json();
            const server = (config.servers || []).find(
              s => s.secure === true && s.url
            );

            if (!server) throw new Error('No secure CyTube server available');

            return new Promise((resolve, reject) => {
              const socket = io(server.url, {
                transports: ['websocket'],
                forceNew: true,
                reconnection: false,
                autoConnect: false,
                timeout: 12000
              });

              let completed = false;
              let playlist = [];
              let currentUid = null;

              const timer = setTimeout(() => {
                finish(new Error('No current video confirmed within 20 seconds'));
              }, 20000);

              function finish(error, title) {
                if (completed) return;
                completed = true;
                clearTimeout(timer);
                socket.removeAllListeners();
                socket.disconnect();
                if (error) reject(error);
                else resolve(title);
              }

              function checkPlaylist() {
                if (currentUid === null) return;

                const item = playlist.find(
                  entry => String(entry.uid) === String(currentUid)
                );

                const title = item && currentTitle(item.media || item);
                if (title) finish(null, title);
              }

              socket.on('connect', () => {
                socket.emit('joinChannel', { name: CHANNEL });
              });

              socket.on('changeMedia', media => {
                const title = currentTitle(media);
                if (title) finish(null, title);
              });

              socket.on('playlist', data => {
                playlist = Array.isArray(data)
                  ? data
                  : Array.isArray(data && data.items)
                    ? data.items
                    : [];
                checkPlaylist();
              });

              socket.on('setCurrent', data => {
                currentUid = data && typeof data === 'object'
                  ? data.uid
                  : data;
                checkPlaylist();
              });

              socket.on('needPassword', () => {
                finish(new Error('Room requires a password'));
              });

              socket.on('connect_error', error => {
                finish(new Error('Connection failed: ' + error.message));
              });

              socket.on('disconnect', reason => {
                finish(new Error('Disconnected: ' + reason));
              });

              socket.connect();
            });
          }

          async function main() {
            if (!TOKEN) {
              throw new Error('Missing DBN_UPDATE_TOKEN secret');
            }

            const title = await readOneRoom();

            console.log('Confirmed CyTube title:', title);

            const response = await fetch(WORKER_URL, {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + TOKEN,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                channel_name: CHANNEL,
                video_title: title
              }),
              signal: AbortSignal.timeout(15000)
            });

            if (!response.ok) {
              throw new Error('Cloudflare update HTTP ' + response.status);
            }

            console.log('Cloudflare record updated successfully.');
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
